[workspace]
resolver = "3"
members = [
    "crates/moonbase",
    "crates/tauri-plugin-moonbase",
    "examples/tauri-app/src-tauri",
]
# The Tauri crates need the platform webview's development libraries
# (webkit2gtk on Linux), so a bare `cargo build` / `cargo test` at the root sticks
# to the core SDK. Pass `--workspace` to build everything.
default-members = ["crates/moonbase"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Moonbase-sh/moonbase-rs"
homepage = "https://moonbase.sh"
authors = ["Moonbase AS"]

[workspace.dependencies]
moonbase = { version = "0.1.0", path = "crates/moonbase" }
tauri-plugin-moonbase = { version = "0.1.0", path = "crates/tauri-plugin-moonbase" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"

[profile.release]
codegen-units = 1
lto = true
strip = true
