[package]
name = "moonbase"
description = "Moonbase license activation for desktop apps and audio plugins: browser and offline activation, local RS256 validation, revocation, add-ons, version-limited licenses and the cross-SDK device fingerprint."
keywords = ["licensing", "activation", "moonbase", "license", "drm"]
categories = ["authentication", "api-bindings"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["ureq-transport"]
# The bundled blocking HTTP transport (ureq + rustls). Turn it off to drop the
# dependency and supply your own `HttpTransport`.
ureq-transport = ["dep:ureq"]

[dependencies]
base64 = "0.22"
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = "0.1.24"
ureq = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "activation"
required-features = ["ureq-transport"]

[[example]]
name = "device_id"
