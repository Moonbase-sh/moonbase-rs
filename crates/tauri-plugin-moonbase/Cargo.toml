[package]
name = "tauri-plugin-moonbase"
description = "Moonbase license activation for Tauri 2 apps, with a finished activation UI: browser and offline activation, trials, add-ons, upgrades, updates and a license-state event for your own UI."
keywords = ["tauri", "tauri-plugin", "licensing", "activation", "moonbase"]
categories = ["gui", "authentication"]
readme = "README.md"
links = "tauri-plugin-moonbase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
exclude = ["/guest-js/node_modules"]

[dependencies]
base64 = "0.22"
log = "0.4"
moonbase = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
ureq = "3"

[dev-dependencies]
ring = "0.17"
tauri = { workspace = true, features = ["test"] }
tempfile = "3"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
